name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Nix build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build module
        run: nix build -L

      - name: ls -l
        run: ls -l

      - name: ls -l result/lib/
        run: ls -l result/lib/

      # Stage 2: inspect the plugin with lm and check the expected API is exported
      - name: Plugin check (lm)
        run: |
          nix develop -c bash -c '"$LOGOS_MODULE_ROOT/bin/lm" result/lib/agent_module_plugin.so' | tee lm.txt
          for name in getStatus initialize getIdentity \
                      setupOwnerChannel processOwnerCommand sendToOwner getOwnerChannelStatus \
                      listSkills executeSkill \
                      ownerResponse skillCompleted statusChanged; do
            grep -qw "$name" lm.txt || { echo "-- lm: MISSING: $name"; exit 1; }
          done
          echo "-- All expected methods/events found."

      # Stage 4: run the plugin in a real logoscore daemon and call the skills
      - name: Install logoscore
        run: |
          curl -fsSL -o logoscore.tar.gz \
            https://github.com/logos-co/logos-logoscore-cli/releases/download/v0.2.2/logoscore-x86_64-linux.tar.gz
          tar -xzf logoscore.tar.gz
          mkdir -p "$HOME/.local/bin"
          mv logoscore-x86_64.AppImage "$HOME/.local/bin/logoscore"
          chmod +x "$HOME/.local/bin/logoscore"
          echo "LOGOSCORE_BIN=$HOME/.local/bin/logoscore" >> "$GITHUB_ENV"

      - name: Runtime smoke test (logoscore)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"   # runner has no FUSE
          
        run: |
          logoscore daemon -m ~/logoscore-modules & sleep 3
          logoscore status

        # todo
        # run: bash tests/smoke_logoscore.sh "$LOGOSCORE_BIN"
